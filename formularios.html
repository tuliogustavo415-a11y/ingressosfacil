<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

    <main class="container py-5">
        <h1 class="h3 text-center mb-4">IngressosFácil</h1>

        <div class="row g-4">

            <!-- Formulário de cadastro -->
            <div class="col-12 col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h5 mb-3">Criar conta</h2>

                        <div id="alerta-cadastro" class="alert" role="alert" hidden></div>

                        <form id="form-cadastro">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="voce@exemplo.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoria preferida</label>
                                <select class="form-select" id="categoria" name="categoria" required>
                                    <option value="">Selecione...</option>
                                    <option value="show">Shows</option>
                                    <option value="comedia">Comédia</option>
                                    <option value="esporte">Esportes</option>
                                    <option value="gastronomia">Gastronomia</option>
                                </select>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termos" name="termos" required>
                                <label class="form-check-label" for="termos">Li e aceito os termos de uso</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Formulário de login -->
            <div class="col-12 col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h5 mb-3">Entrar</h2>

                        <div id="alerta-login" class="alert" role="alert" hidden></div>

                        <form id="form-login">
                            <div class="mb-3">
                                <label for="login-email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="login-email" name="email" placeholder="voce@exemplo.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="login-senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="login-senha" name="senha" placeholder="Sua senha" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ===== Elementos do cadastro =====
const formCadastro = document.getElementById("form-cadastro");
const nome = document.getElementById("nome");
const email = document.getElementById("email");
const senha = document.getElementById("senha");
const categoria = document.getElementById("categoria");
const termos = document.getElementById("termos");
const alertaCadastro = document.getElementById("alerta-cadastro");

// ===== Elementos do login =====
const formLogin = document.getElementById("form-login");
const loginEmail = document.getElementById("login-email");
const loginSenha = document.getElementById("login-senha");
const alertaLogin = document.getElementById("alerta-login");

function mostrarAlerta(alerta, texto, tipo) {
    alerta.textContent = texto;                 // escreve a mensagem
    alerta.className = "alert alert-" + tipo;   // troca as classes: define a cor
    alerta.hidden = false;                      // mostra o alerta
}

formCadastro.addEventListener("submit", function (event) {
    event.preventDefault();

    const usuario = {
        nome: nome.value.trim(),
        email: email.value.trim().toLowerCase(),
        senha: senha.value,
        categoria: categoria.value,
        aceitouTermos: termos.checked
    };

    const nomeCategoria = categoria.selectedOptions[0].textContent;

    mostrarAlerta(
        alertaCadastro,
        `Cadastro realizado, ${usuario.nome}! E-mail: ${usuario.email}. Categoria preferida: ${nomeCategoria}.`,
        "success"
    );

    formCadastro.reset();   // limpa o formulário
});

formLogin.addEventListener("submit", function (event) {
    event.preventDefault();

    const emailDigitado = loginEmail.value.trim().toLowerCase();
    const senhaDigitada = loginSenha.value;

    if (emailDigitado === "aluno@exemplo.com" && senhaDigitada === "123456") {
        mostrarAlerta(alertaLogin, "Login realizado com sucesso. Bem-vindo(a)!", "success");
        formLogin.reset();
    } else {
        mostrarAlerta(alertaLogin, "E-mail ou senha incorretos.", "danger");
    }
});
        
    </script>
</body>
</html>
